<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RAGLab</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <div class="eyebrow">RAGLab</div>
          <h1>RAG strategy selector</h1>
        </div>
        <div class="status-pill" id="status">RAG engine ready</div>
      </header>

      <section class="workspace-grid">
        <aside class="control-panel">
          <section class="panel-block">
            <div class="block-head">
              <h2>Dataset</h2>
              <button class="icon-button" type="button" id="loadSample" title="Reload sample">↻</button>
            </div>
            <div class="stat-grid">
              <div class="stat-box"><strong id="statChunks">0</strong><span>Chunks</span></div>
              <div class="stat-box"><strong id="statEntities">0</strong><span>Entities</span></div>
              <div class="stat-box"><strong id="statRelations">0</strong><span>Relations</span></div>
              <div class="stat-box"><strong id="statTokens">0</strong><span>Avg tokens</span></div>
            </div>
            <div class="dataset-meta">
              <strong id="datasetTitle">No dataset</strong>
              <span id="datasetSource">Waiting</span>
            </div>
            <input class="hidden-input" id="fileInput" type="file" accept=".txt,.md,.csv" />
            <button class="secondary-button" type="button" id="uploadButton">Upload file</button>
            <textarea class="dataset-input" id="datasetText" placeholder="Paste TXT, Markdown, or CSV content"></textarea>
            <button class="secondary-button" type="button" id="indexText">Index pasted text</button>
          </section>

          <section class="panel-block">
            <div class="block-head">
              <h2>Memory</h2>
              <span class="count-badge" id="memoryCount">0</span>
            </div>
            <textarea class="memory-input" id="memoryText">Prefer the cheapest fully online architecture that still shows real retrieval evidence.</textarea>
            <button class="secondary-button" type="button" id="addMemory">Add memory</button>
            <div class="memory-list" id="memoryList"></div>
          </section>
        </aside>

        <section class="query-stage">
          <section class="query-panel">
            <div class="question-row">
              <textarea id="question">Which RAG method is safest for a mixed query about Vercel and Supabase deployment?</textarea>
              <button class="run-button" type="button" id="runQuery">Run</button>
            </div>
            <div class="question-bank" id="questionBank"></div>
          </section>

          <section class="recommendation-band is-hidden" id="recommendationBand">
            <div>
              <span>Recommended</span>
              <h2 id="recommendedLabel">-</h2>
              <p id="recommendedReason"></p>
            </div>
            <div class="query-type" id="queryType">mixed</div>
          </section>

          <section class="result-layout is-hidden" id="resultLayout">
            <div class="method-column" id="methodColumn"></div>
            <article class="method-detail" id="methodDetail"></article>
          </section>

          <section class="empty-state" id="emptyState">
            <h2>Ready to compare retrieval strategies</h2>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
